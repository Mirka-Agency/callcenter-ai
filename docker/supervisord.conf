[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue-voip]
command=/usr/local/bin/queue-worker
directory=/var/www/html
user=www-data
environment=QUEUE_WORKER_QUEUES="voip"
autostart=true
autorestart=true
priority=20
startsecs=5
stopwaitsecs=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue-analysis]
command=/usr/local/bin/queue-worker
directory=/var/www/html
user=www-data
environment=QUEUE_WORKER_QUEUES="analysis"
numprocs=%(ENV_ANALYSIS_QUEUE_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
priority=20
startsecs=5
stopwaitsecs=3660
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue-followup]
command=/usr/local/bin/queue-worker
directory=/var/www/html
user=www-data
environment=QUEUE_WORKER_QUEUES="followup,default"
autostart=true
autorestart=true
priority=20
startsecs=5
stopwaitsecs=3660
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-scheduler]
command=/usr/local/bin/scheduler
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
