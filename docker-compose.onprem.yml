# Single-employer on-prem stack (LAN). Uses PostgreSQL like cloud production.
# See docs/on-prem.md
#
#   cp .env.onprem.example .env
#   # set APP_KEY and passwords, then:
#   docker compose -f docker-compose.onprem.yml up -d --build
#   docker compose -f docker-compose.onprem.yml exec app php artisan db:seed --class=OnPremSeeder --force

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-callcenter}
      POSTGRES_USER: ${DB_USERNAME:-callcenter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - onprem_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - onprem

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: web
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      RECORDINGS_DISK: local
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
    ports:
      - "${ONPREM_HTTP_PORT:-8000}:8000"
    volumes:
      - onprem_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onprem

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["realtime"]
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: reverb
      RUN_MIGRATIONS: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      LOG_CHANNEL: stderr
    ports:
      - "${REVERB_SERVER_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - onprem

volumes:
  onprem_postgres_data:
  onprem_storage:

networks:
  onprem:
    driver: bridge
